<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pricing | Northwind Rota</title>
    <style>
      /* A customer's page, deliberately styled unlike the widget. */
      * {
        font-family: Georgia, serif;
      }
      body {
        margin: 0;
        color: #3b2d5e;
        background: #f6f1e7;
        line-height: 1.9;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 50;
        padding: 14px 24px;
        background: #221b33;
        color: #fff;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px 120vh;
      }
      button {
        border: 3px dashed red;
        background: yellow;
      }
    </style>
  </head>
  <body>
    <header><strong>Northwind Rota</strong> test host on :8790</header>
    <main>
      <h1>Pricing</h1>
      <p>
        This page is served from a different origin than the widget Worker, the way a customer's
        site would be. The snippet below is the whole install.
      </p>
      <p><button type="button">A host button</button></p>
      <p>Scroll down to check the launcher stays put.</p>
    </main>

    <!-- The install snippet. Site key from `pnpm seed:dev`. -->
    <script
      src="http://localhost:8788/embed.js"
      data-site-key="wk_00000000000000000000000000000001"
      async
    ></script>
  </body>
</html>
