<!doctype html>
<!--
  PROTOTYPE, throwaway. Delete once the widget states are agreed.
  Question: does option C (labelled pill, source-first answer cards, no persona,
  first-class "not found") communicate "answers only from what you published"?
  Run: open packages/widget-ui/prototype/widget-c.prototype.html
  Switch state with the bottom bar or the arrow keys. ?state=<key>&device=desktop|mobile
  All data is fixture. "Northwind Rota" is a made-up tenant.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Widget C prototype</title>
<style>
  :root {
    --brand: #0f5c4d;
    --brand-ink: #ffffff;
    --brand-soft: #e7f2ef;
    --ink: #17201d;
    --ink-2: #4a5652;
    --ink-3: #6b7672;
    --line: #dde3e1;
    --surface: #ffffff;
    --surface-2: #f5f7f6;
    --mark: #fff0b3;
    --warn-soft: #fdf6e7;
    --warn-line: #e9d29a;
    --ok: #1d7a46;
    --radius: 14px;
    --shadow: 0 12px 40px rgba(15, 30, 25, 0.18), 0 2px 6px rgba(15, 30, 25, 0.08);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); color: var(--ink); background: #e9ecea; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---------- prototype chrome (not part of the design) ---------- */
  .stage { display: flex; gap: 24px; padding: 24px 24px 96px; min-height: 100vh; align-items: flex-start; }
  .notes { width: 340px; flex: none; background: #111; color: #eee; border-radius: 12px; padding: 18px 20px; font-size: 14px; line-height: 1.55; position: sticky; top: 24px; }
  .notes h2 { font-size: 16px; margin: 0 0 4px; color: #fff; }
  .notes .tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #9fd8c9; margin: 14px 0 4px; }
  .notes p { margin: 0; color: #d6d6d6; }
  .notes code { font-size: 12px; background: #262626; padding: 1px 4px; border-radius: 4px; color: #f0e3b0; }
  .viewport-wrap { flex: 1; display: flex; justify-content: center; }
  .viewport { position: relative; overflow: hidden; background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .viewport.desktop { width: 100%; max-width: 1180px; height: 760px; }
  .viewport.mobile { width: 390px; height: 800px; border-radius: 36px; border: 10px solid #1b1b1b; }
  .switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: #111; color: #fff; border-radius: 999px; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.35); z-index: 100; font-size: 13px; }
  .switcher button { background: transparent; border: 0; color: #fff; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
  .switcher button:hover { background: #2a2a2a; }
  .switcher .label { min-width: 230px; text-align: center; font-weight: 600; }
  .switcher .sep { width: 1px; height: 20px; background: #333; }
  .switcher .on { background: #2f2f2f; }
  .toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: #111; color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 8px; z-index: 50; }

  /* ---------- fake host page ---------- */
  .host { height: 100%; overflow: hidden; color: #222; }
  .host header { display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; border-bottom: 1px solid #eee; }
  .host .logo { font-weight: 800; letter-spacing: -.02em; }
  .host nav { display: flex; gap: 22px; font-size: 14px; color: #555; }
  .host .hero { padding: 72px 32px; max-width: 620px; }
  .host .hero h1 { font-size: 44px; line-height: 1.05; letter-spacing: -.03em; margin: 0 0 16px; }
  .host .hero p { font-size: 18px; color: #555; line-height: 1.5; }
  .host .blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 32px; }
  .host .blocks div { height: 120px; background: #f3f3f1; border-radius: 10px; }
  .viewport.mobile .host header { padding: 14px 18px; }
  .viewport.mobile .host nav { display: none; }
  .viewport.mobile .host .hero { padding: 40px 18px; }
  .viewport.mobile .host .hero h1 { font-size: 32px; }
  .viewport.mobile .host .blocks { grid-template-columns: 1fr; padding: 0 18px; }

  /* ---------- widget ---------- */
  .w-launcher { position: absolute; right: 24px; bottom: 24px; display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px 0 16px; border-radius: 999px; border: 0; background: var(--brand); color: var(--brand-ink); box-shadow: var(--shadow); cursor: pointer; font-weight: 600; font-size: 15px; }
  .w-launcher svg { flex: none; }
  .viewport.mobile .w-launcher { right: 14px; bottom: 14px; font-size: 14px; }

  .w-panel { position: absolute; right: 24px; bottom: 24px; width: 400px; height: min(660px, calc(100% - 48px)); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); }
  .viewport.mobile .w-panel { inset: 0; width: auto; height: auto; border-radius: 0; border: 0; }

  .w-head { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .w-head .t { flex: 1; min-width: 0; }
  .w-head h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
  .w-scope { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
  .w-scope strong { color: var(--ink); font-weight: 600; }
  .w-x { width: 44px; height: 44px; margin: -10px -10px 0 0; border: 0; background: transparent; border-radius: 10px; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }
  .w-x:hover { background: var(--surface-2); }

  .w-body { flex: 1; overflow-y: auto; padding: 16px 18px 8px; display: flex; flex-direction: column; gap: 18px; }
  .w-body > * { flex-shrink: 0; }

  .w-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
  .w-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .w-chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2); }
  .w-sugg { display: flex; flex-direction: column; gap: 6px; }
  .w-sugg button { text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; min-height: 44px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .w-sugg button:hover { border-color: var(--brand); background: var(--brand-soft); }

  .w-q { font-size: 15px; font-weight: 600; line-height: 1.4; margin: 0; }
  .w-q-label { font-size: 12px; color: var(--ink-3); margin: 0 0 2px; }

  .w-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .w-src { background: var(--surface-2); padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .w-src-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
  .w-src-meta .title { font-weight: 600; color: var(--ink); }
  .w-src-meta .path { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w-src-meta .asof { margin-left: auto; white-space: nowrap; font-size: 12px; color: var(--ink-3); }
  .w-quote { margin: 0; padding-left: 12px; border-left: 3px solid var(--brand); font-size: 14px; line-height: 1.55; color: var(--ink-2); }
  .w-quote mark { background: var(--mark); color: var(--ink); padding: 0 2px; border-radius: 3px; }
  .w-open { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--brand); text-decoration: none; min-height: 32px; }
  .w-open:hover { text-decoration: underline; }
  .w-ans { padding: 12px 14px 14px; font-size: 15px; line-height: 1.55; }
  .w-ans p { margin: 0; }
  .w-more { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; background: var(--surface); width: 100%; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; text-align: left; min-height: 44px; }

  .w-gap { border: 1px dashed var(--warn-line); background: var(--warn-soft); border-radius: 12px; padding: 14px; }
  .w-gap h3 { margin: 0 0 4px; font-size: 15px; }
  .w-gap p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .w-gap .searched { font-size: 13px; color: var(--ink-3); margin-top: 8px; }

  .w-form { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .w-field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .w-field .opt { font-weight: 400; color: var(--ink-3); }
  .w-field input, .w-field textarea { width: 100%; border: 1px solid #c7cfcc; border-radius: 8px; padding: 10px 12px; font-size: 16px; background: #fff; min-height: 44px; }
  .w-field textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
  .w-btn { min-height: 44px; border: 0; border-radius: 10px; background: var(--brand); color: var(--brand-ink); font-weight: 600; padding: 0 16px; cursor: pointer; font-size: 15px; }
  .w-btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
  .w-who { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  .w-loop { font-size: 13px; color: var(--ink-3); line-height: 1.45; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; display: flex; gap: 8px; }

  .w-sent { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .w-sent h3 { margin: 6px 0 6px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .w-sent dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
  .w-sent dt { color: var(--ink-3); }
  .w-sent dd { margin: 0; }

  .w-searching { display: flex; flex-direction: column; gap: 8px; }
  .w-step { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
  .w-step .dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .w-step.done .dot { background: var(--brand-soft); color: var(--brand); }
  .w-step.live .dot { border: 2px solid var(--brand); border-top-color: transparent; animation: spin .8s linear infinite; }
  .w-skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #eef1f0, #f7f9f8, #eef1f0); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .w-step.live .dot, .w-skel { animation: none; } }

  .w-foot { border-top: 1px solid var(--line); padding: 10px 12px 12px; }
  .w-input { display: flex; gap: 8px; align-items: flex-end; }
  .w-input textarea { flex: 1; resize: none; border: 1px solid #c7cfcc; border-radius: 10px; padding: 11px 12px; font-size: 16px; min-height: 44px; max-height: 120px; line-height: 1.4; }
  .w-send { width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; cursor: pointer; flex: none; }
  .w-fine { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--ink-3); }
  .w-fine button { border: 0; background: transparent; color: var(--brand); font-weight: 600; font-size: 12px; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>
<div class="stage">
  <aside class="notes" id="notes" aria-live="polite"></aside>
  <div class="viewport-wrap"><div class="viewport" id="viewport"></div></div>
</div>
<div class="switcher" role="toolbar" aria-label="Prototype controls">
  <button type="button" id="prev" aria-label="Previous state">&larr;</button>
  <span class="label" id="label"></span>
  <button type="button" id="next" aria-label="Next state">&rarr;</button>
  <span class="sep"></span>
  <button type="button" id="desk">Desktop</button>
  <button type="button" id="mob">Mobile</button>
</div>

<script>
// ---------------- fixture data ----------------
const T = {
  name: "Northwind Rota",
  domain: "northwindrota.com",
  pages: 42,
  smallPages: 5,
  topics: ["Pricing", "Setup", "Refunds", "Integrations"],
  updated: "2 days ago",
  owner: "Sam",
  replyTime: "within 4 hours",
};
const SRC_BILLING = {
  title: "Billing and plans",
  path: "/help/billing#pausing",
  asOf: "28 Oct",
  before: "You can ",
  hit: "pause any paid plan for up to 3 months a year",
  after: ". While paused, your rotas stay readable but nobody can edit them, and you are not charged.",
};

// ---------------- icons (inline SVG, decorative unless labelled) ----------------
const I = {
  ask: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8 13h8M8 17h5"/></svg>',
  x: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  doc: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></svg>',
  arrow: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  send: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  person: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  grow: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 20V10M12 10c0-4 3-6 7-6 0 4-3 6-7 6zM12 13c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>',
};

// ---------------- widget pieces ----------------
const head = (small) => `
  <div class="w-head">
    <div class="t">
      <h2 id="w-title">Ask ${T.name}</h2>
      <p class="w-scope">${small
        ? `Answers from the <strong>${T.domain}</strong> help pages, updated ${T.updated}`
        : `Answers from <strong>${T.pages} pages</strong> of ${T.domain}, updated ${T.updated}`}</p>
    </div>
    <button class="w-x" aria-label="Close">${I.x}</button>
  </div>`;

const foot = () => `
  <div class="w-foot">
    <form class="w-input" onsubmit="return false">
      <label for="w-ask" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Your question</label>
      <textarea id="w-ask" rows="1" placeholder="Ask a question"></textarea>
      <button class="w-send" aria-label="Send question">${I.send}</button>
    </form>
    <div class="w-fine">
      <span>Only uses what ${T.name} has published</span>
      <button type="button">Talk to a person</button>
    </div>
  </div>`;

const question = (q) => `<div><p class="w-q-label">You asked</p><p class="w-q">${q}</p></div>`;

const source = (s) => `
  <div class="w-src">
    <div class="w-src-meta">${I.doc}<span class="title">${s.title}</span><span class="path">${s.path}</span><span class="asof">as of ${s.asOf}</span></div>
    <blockquote class="w-quote">${s.before}<mark>${s.hit}</mark>${s.after}</blockquote>
    <a class="w-open" href="https://${T.domain}${s.path.split("#")[0]}#:~:text=${encodeURIComponent(s.hit)}" data-fake>Open the page at this passage ${I.arrow}</a>
  </div>`;

const handoffForm = (prefill, cta) => `
  <form class="w-form" onsubmit="return false">
    <div class="w-field"><label for="hf-email">Your email</label><input id="hf-email" type="email" autocomplete="email" inputmode="email" value="" placeholder="you@company.com" /></div>
    <div class="w-field"><label for="hf-name">Name <span class="opt">(optional)</span></label><input id="hf-name" autocomplete="name" /></div>
    <div class="w-field"><label for="hf-q">Your question</label><textarea id="hf-q">${prefill}</textarea></div>
    <div class="w-who">${I.person}<span>Goes to ${T.owner}, who usually replies ${T.replyTime}.</span></div>
    <button class="w-btn">${cta}</button>
  </form>`;

const loopLine = `<div class="w-loop">${I.grow}<span>Questions like this help ${T.name} add the answer to their help pages.</span></div>`;

// ---------------- states ----------------
const STATES = [
  {
    key: "closed",
    name: "Closed: labelled launcher",
    plain: "Before anyone opens it, the button says what it is for. Not a speech bubble that could be anything, but a label naming the things it actually knows about.",
    tech: "Label comes from the tenant's top topics in widget config (KV). Truncate to 3 topics, 32 chars. Falls back to 'Ask a question' if the index has no topics yet.",
    decision: "Pill with text over icon-only bubble. Costs ~200px of horizontal space on the host page; owners can collapse it to icon-only in settings.",
    open: false,
  },
  {
    key: "empty",
    name: "Open: scope shown up front",
    plain: "No greeting, no fake name. The first thing a visitor sees is what it has read and how recently. That one line is the promise 'only what you published', proved instead of claimed.",
    tech: "Needs <code>pageCount</code>, <code>topics[]</code>, <code>lastIndexedAt</code> from index metadata, plus <code>suggestedQuestions[]</code> from real top-asked questions. All stale-tolerant, so served with widget config from KV.",
    decision: "Suggested questions are real top-asked questions, never hardcoded. Until a tenant has 20+ questions, show topics only.",
    open: true,
    body: () => `
      <div><p class="w-label">What it knows about</p><div class="w-chips">${T.topics.map(t => `<span class="w-chip">${t}</span>`).join("")}</div></div>
      <div><p class="w-label">Asked most this week</p><div class="w-sugg">
        ${["Can I pause my subscription over summer?", "How do I import staff from a spreadsheet?", "What happens to my data if I cancel?"]
          .map(q => `<button>${q}${I.arrow}</button>`).join("")}
      </div></div>`,
  },
  {
    key: "empty-small",
    name: "Open: small site (under 10 pages)",
    plain: "If a business has only published a handful of pages, saying 'answers from 5 pages' makes it sound thin. So it names the site instead of counting.",
    tech: "Threshold <code>pageCount &lt; 10</code> switches the scope copy. Purely a widget-side branch on the same config payload.",
    decision: "Threshold of 10 is a guess. Revisit once real tenants exist.",
    open: true, small: true,
    body: () => `<div><p class="w-label">What it knows about</p><div class="w-chips">${["Pricing", "Setup"].map(t => `<span class="w-chip">${t}</span>`).join("")}</div></div>`,
  },
  {
    key: "searching",
    name: "Working: shows what it is reading",
    plain: "While it thinks, it shows which of your pages it is looking at, not three bouncing dots. The visitor watches it go to your site for the answer.",
    tech: "Needs a <code>sources</code> event from the turn <em>before</em> text starts streaming: retrieval finishes first, so emit matched page titles as soon as reranking returns. New chunk type on the stream.",
    decision: "Only page titles are shown here, not scores. Scores mean nothing to visitors.",
    open: true,
    body: () => `
      ${question("Can I pause my subscription over summer?")}
      <div class="w-searching" role="status" aria-label="Searching ${T.domain}">
        <p class="w-label" style="margin:0">Searching ${T.domain}</p>
        <div class="w-step done"><span class="dot">${I.check}</span>Billing and plans</div>
        <div class="w-step done"><span class="dot">${I.check}</span>Account settings</div>
        <div class="w-step live"><span class="dot"></span>Writing the answer</div>
        <div class="w-skel" style="width:92%;margin-top:6px"></div><div class="w-skel" style="width:78%"></div>
      </div>`,
  },
  {
    key: "answered",
    name: "Answered: source first",
    plain: "The answer leads with the exact sentence from your site, highlighted, then explains it in plain words. 'Open the page' jumps straight to that sentence. The visitor can check it themselves in one tap.",
    tech: "Needs structured citations from the turn: <code>{ title, url, excerpt, highlight, indexedAt }</code>, taken from retrieved chunks, never parsed from model text. Link uses a text fragment (<code>#:~:text=</code>); browsers that lack it just open the page.",
    decision: "Show 'as of' date on every source. No attempt to detect pages changed since the last crawl.",
    open: true,
    body: () => `
      ${question("Can I pause my subscription over summer?")}
      <article class="w-card" aria-label="Answer">
        ${source(SRC_BILLING)}
        <div class="w-ans"><p>Yes. You can pause for up to 3 months a year. Your rotas stay visible while paused but can't be edited, and you won't be charged.</p></div>
        <button class="w-more">${I.doc}1 more source: Account settings</button>
      </article>`,
  },
  {
    key: "partial",
    name: "Partial: says which half it knows",
    plain: "When a question has two parts and the site only covers one, it answers that part with its source, then says plainly what is missing and offers to send just that part to a person.",
    tech: "Needs a third outcome beyond answer and escalate: <code>answered | partial | not_found</code>, with <code>uncovered: string</code> for partial. Today the turn only has escalate yes or no. This is the backend change the prototype exposes.",
    decision: "Answer what is covered and offer to send the rest. Not escalate the whole thing.",
    open: true,
    body: () => `
      ${question("Can I pause my plan and keep the Slack integration running?")}
      <article class="w-card" aria-label="Answer">
        ${source(SRC_BILLING)}
        <div class="w-ans"><p>You can pause your plan for up to 3 months a year, and you won't be charged while paused.</p></div>
      </article>
      <section class="w-gap" aria-labelledby="gap-h">
        <h3 id="gap-h">Not covered on ${T.domain}</h3>
        <p>Nothing published says whether integrations like Slack keep running while a plan is paused.</p>
        ${handoffForm("Do integrations like Slack keep running while my plan is paused?", `Send this part to ${T.owner}`)}
      </section>`,
  },
  {
    key: "not-found",
    name: "Not found: honest, then a person",
    plain: "If your site doesn't cover it, it says so, shows where it looked, and takes the visitor's details for you. It never makes something up. The footer line tells them the question helps fill the gap.",
    tech: "Escalation decision drives this state. 'Where it looked' is the top retrieved page titles even though they scored below threshold. Form posts to the outbound queue path.",
    decision: "Email required, name optional, question pre-filled and editable.",
    open: true,
    body: () => `
      ${question("Do you offer a discount for charities?")}
      <section class="w-gap" aria-labelledby="nf-h">
        <h3 id="nf-h">Nothing on ${T.domain} covers this</h3>
        <p>Rather than guess, it can go to ${T.owner} at ${T.name}.</p>
        <p class="searched">Looked in: Pricing, Billing and plans, FAQ</p>
        ${handoffForm("Do you offer a discount for charities?", `Send to ${T.owner}`)}
        ${loopLine}
      </section>`,
  },
  {
    key: "sent",
    name: "Handed off: what happens next",
    plain: "After sending, the visitor sees who has it, where the reply will arrive and roughly when. They can keep asking other things.",
    tech: "Reference id is the conversation id, shortened. Confirmation only after the outbound enqueue succeeds; on failure keep the form filled and show the error next to the button.",
    decision: "Visitor can keep asking in the same window after handing off.",
    open: true,
    body: () => `
      ${question("Do you offer a discount for charities?")}
      <section class="w-sent" role="status">
        <h3><span style="color:var(--ok)">${I.check}</span>Sent to ${T.owner}</h3>
        <p style="margin:0;font-size:14px;color:var(--ink-2)">You don't need to keep this window open.</p>
        <dl><dt>Reply to</dt><dd>jo@example.com</dd><dt>Expect it</dt><dd>${T.replyTime}</dd><dt>Reference</dt><dd>NR-4F2K</dd></dl>
      </section>
      ${loopLine}
      <button class="w-btn ghost">Ask something else</button>`,
  },
];

// ---------------- render ----------------
const params = new URLSearchParams(location.search);
let idx = Math.max(0, STATES.findIndex(s => s.key === params.get("state")));
let device = params.get("device") === "mobile" ? "mobile" : "desktop";

function hostPage() {
  return `<div class="host" aria-hidden="true">
    <header><span class="logo">${T.name}</span><nav><span>Product</span><span>Pricing</span><span>Help</span><span>Log in</span></nav></header>
    <section class="hero"><h1>Staff rotas that sort themselves out.</h1><p>Build the week's shifts in minutes, swap them from your phone, and stop chasing people on WhatsApp.</p></section>
    <div class="blocks"><div></div><div></div><div></div></div>
  </div>`;
}

function render() {
  const s = STATES[idx];
  const vp = document.getElementById("viewport");
  vp.className = `viewport ${device}`;
  const widget = s.open
    ? `<div class="w-panel" role="dialog" aria-labelledby="w-title">${head(s.small)}<div class="w-body">${s.body()}</div>${foot()}</div>`
    : `<button class="w-launcher">${I.ask}<span>Ask about ${T.topics.slice(0, 3).join(", ").toLowerCase()}</span></button>`;
  vp.innerHTML = hostPage() + widget;

  document.getElementById("notes").innerHTML = `
    <h2>${idx + 1}/${STATES.length} &middot; ${s.name}</h2>
    <div class="tag">In plain terms</div><p>${s.plain}</p>
    <div class="tag">What the code needs</div><p>${s.tech}</p>
    <div class="tag">Decision taken</div><p>${s.decision}</p>`;
  document.getElementById("label").textContent = s.name;
  document.getElementById("desk").classList.toggle("on", device === "desktop");
  document.getElementById("mob").classList.toggle("on", device === "mobile");

  for (const a of vp.querySelectorAll("[data-fake]")) a.addEventListener("click", e => {
    e.preventDefault();
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = "Would open the page scrolled to the highlighted sentence";
    vp.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  });

  const p = new URLSearchParams({ state: s.key, device });
  history.replaceState(null, "", `?${p}`);
}

const go = (d) => { idx = (idx + d + STATES.length) % STATES.length; render(); };
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.getElementById("desk").onclick = () => { device = "desktop"; render(); };
document.getElementById("mob").onclick = () => { device = "mobile"; render(); };
document.addEventListener("keydown", (e) => {
  const el = document.activeElement;
  if (el && (el.matches("input, textarea, [contenteditable]"))) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
render();
</script>
</body>
</html>
